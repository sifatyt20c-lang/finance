{% extends "layout.html" %}
{% block title %}History{% endblock %}
{% block body %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Shares</th>
                <th>Price</th>
                <th>Transacted</th>
            </tr>
        </thead>
        <tbody>
            {% for t in transactions %}
            <tr>
                <td>{{ t.symbol }}</td>
                <td>{{ t.shares }}</td>
                <td>{{ t.price | usd }}</td>
                <td>{{ t.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
